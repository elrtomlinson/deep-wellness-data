# Deterministic per-edit pattern checks for the security-guidance plugin.
# These are string/regex matches with no model call, so they cost nothing.
# Docs: https://code.claude.com/docs/en/security-guidance#add-custom-per-edit-patterns
#
# NOTE: YAML parsing requires PyYAML to be importable by the plugin's Python.
# If these rules never fire, rename this file to security-patterns.json and
# convert it (same schema) - JSON works on any Python install.

patterns:
  - rule_name: service_role_clientside
    substrings: ["SUPABASE_SERVICE_ROLE", "service_role", "SERVICE_ROLE_KEY"]
    paths: ["**/src/**"]
    reminder: >-
      The service_role key bypasses Row Level Security entirely. It must never
      appear in client code or in any VITE_-prefixed variable. Move this call to
      a Supabase Edge Function under supabase/functions/.

  - rule_name: vite_env_secret
    regex: "VITE_[A-Z0-9_]*(SECRET|SERVICE|PRIVATE|PASSWORD|TOKEN)"
    reminder: >-
      Everything prefixed VITE_ is inlined into the public browser bundle at
      build time and is readable by anyone. This cannot hold a secret. Use an
      Edge Function with a server-side environment variable instead.

  - rule_name: hardcoded_credential
    substrings: ["sk_live_", "sk_test_", "AKIA", "-----BEGIN PRIVATE KEY-----", "ghp_"]
    reminder: >-
      Hardcoded credential detected. Load it from an environment variable or a
      secret manager, and rotate this value if it was ever committed.

  - rule_name: supabase_table_without_rls_migration
    regex: "create\\s+table"
    paths: ["**/supabase/migrations/**"]
    reminder: >-
      A new table must ship with `alter table ... enable row level security;`
      and explicit policies in the SAME migration. A table without RLS is fully
      readable and writable by anyone holding the public anon key. UPDATE
      policies need BOTH `using` and `with check`. See
      .claude/claude-security-guidance.md.

  - rule_name: view_without_security_invoker
    regex: "create\\s+(or\\s+replace\\s+)?view"
    paths: ["**/supabase/**"]
    reminder: >-
      Views bypass RLS unless created `with (security_invoker = true)`. Without
      it, the view runs as its owner and leaks every underlying row.

  - rule_name: raw_user_meta_data_authz
    substrings: ["raw_user_meta_data"]
    reminder: >-
      raw_user_meta_data is user-editable. Never use it for authorization
      decisions. Use a separate roles table protected by RLS, or a custom JWT
      claim set server-side.

  - rule_name: health_data_logging
    regex: "console\\.(log|info|warn)\\s*\\([^)]*(symptom|medication|diagnosis|condition|healthData|dailyLog)"
    paths: ["**/src/**"]
    exclude_paths: ["**/src/test/**", "**/*.test.*", "**/*.spec.*"]
    reminder: >-
      This logs health-related data to the browser console, where it persists in
      devtools and can be captured by error-reporting tools. Remove the log or
      strip the identifying fields.

  - rule_name: dangerous_dom_injection
    substrings: ["dangerouslySetInnerHTML", ".innerHTML =", "document.write("]
    paths: ["**/src/**"]
    reminder: >-
      Direct DOM injection is an XSS sink. Render the value as text, or sanitize
      with a vetted sanitizer before injecting.
